<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Selector</title>
    <link rel="stylesheet" href="../../scss/main.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">

<!-- Header with back button -->
<header class="container-fluid py-3 bg-secondary d-flex justify-content-between align-items-center">
    <button class="btn btn-outline-light" onclick="window.history.back()">Go Back</button>
    <h1 class="h4">Game Selector</h1>
</header>

<!-- Game selector section -->
<main class="container my-4">
    <div class="row mb-4 align-items-center">
        <div class="col-md-2">
            <!-- Dropdown for selecting game -->
            <select class="form-select" id="gameDropdown" onchange="selectGame()" aria-label="Select game">
                <option selected disabled>Choose a game</option>
                <option value="pong">Pong</option>
                <!-- Add more games as needed -->
            </select>
        </div>

        <!-- Input form for game search -->
        <div class="col-md-8">
            <input type="text" class="form-control" id="gameInput" placeholder="Enter game name">
        </div>

        <div class="col-md-2">
            <!-- Start button -->
            <button class="btn btn-primary w-100" onclick="checkGame()">Start</button>
        </div>
    </div>

    <!-- Game Card for Pong -->
    <div class="card bg-secondary text-light">
        <div class="card-body">
            <h5 class="card-title">Pong</h5>
            <p class="card-text">Pong is a classic arcade game that simulates table tennis. Try to score by getting the ball past your opponent's paddle.</p>

            <!-- Bootstrap Carousel for Game Images -->
            <div id="pongCarousel" class="carousel slide" data-bs-ride="carousel">
                <div class="carousel-inner">
                    <div class="carousel-item active">
                        <img src="path/to/image1.jpg" class="d-block w-100" alt="Pong Image 1">
                    </div>
                    <div class="carousel-item">
                        <img src="path/to/image2.jpg" class="d-block w-100" alt="Pong Image 2">
                    </div>
                    <div class="carousel-item">
                        <img src="path/to/image3.jpg" class="d-block w-100" alt="Pong Image 3">
                    </div>
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#pongCarousel" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#pongCarousel" data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>
        </div>
    </div>
</main>

<!-- Bootstrap JS and custom script -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../js/games.js"></script>

</body>
</html>
