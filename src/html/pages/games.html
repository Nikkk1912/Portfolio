<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Selector</title>
    <link rel="stylesheet" href="../../scss/main.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">

<header class="container-fluid py-3 bg-secondary d-flex justify-content-between align-items-center">
    <a class="btn btn-outline-light" href="index.html">Go Back</a>
    <h1 class="h4">Game Selector</h1>
</header>

<main class="container my-4">
    <div class="row mb-4 align-items-center">
        <div class="col-md-2">
            <select class="form-select" id="gameDropdown" onchange="selectGame()" aria-label="Select game">
                <option selected disabled>Choose a game</option>
                <option value="pong">Pong</option>
            </select>
        </div>

        <div class="col-md-8">
            <input type="text" class="form-control" id="gameInput" placeholder="Enter game name">
        </div>

        <div class="col-md-2">
            <button class="btn btn-primary w-100" onclick="checkGame()">Start</button>
        </div>
    </div>

    <div class="d-flex justify-content-center">
        <div class="card bg-secondary text-light align-item-center">
            <div class="card-body">
                <h5 class="card-title">Pong</h5>
                <p class="card-text">Pong - classic arcade game like table tennis. One player version for training.</p>

<!--                First BootStrap object carousel-->
                <div id="pongCarousel" class="carousel slide" data-bs-ride="carousel">
                    <div class="carousel-inner">
                        <div class="carousel-item active">
                            <img src="../../../../assets/pong-presentation/slide1.jpg" class="d-block w-100"
                                 alt="Pong Image 1">
                        </div>
                        <div class="carousel-item">
                            <img src="../../../../assets/pong-presentation/slide2.jpg" class="d-block w-100"
                                 alt="Pong Image 2">
                        </div>
                        <div class="carousel-item">
                            <img src="../../../../assets/pong-presentation/slide3.jpg" class="d-block w-100"
                                 alt="Pong Image 3">
                        </div>
                    </div>
                    <button class="carousel-control-prev" type="button" data-bs-target="#pongCarousel"
                            data-bs-slide="prev">
                        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Previous</span>
                    </button>
                    <button class="carousel-control-next" type="button" data-bs-target="#pongCarousel"
                            data-bs-slide="next">
                        <span class="carousel-control-next-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Next</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

<!--    Second BootStrap object list-->
    <div class="container mt-5">
        <ul class="list-group">
            <li class="list-group-item">
                <a href="pong.html">Pong</a>
            </li>

            <!--            <li class="list-group-item">-->
            <!--                <a href="game2.html">Game 2</a>-->
            <!--            </li>-->
            <!--            <li class="list-group-item">-->
            <!--                <a href="game3.html">Game 3</a>-->
            <!--            </li>-->
        </ul>
    </div>


</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../js/games.js"></script>

</body>
</html>
